services:

  # Not yet used by the backend, which is still on SQLite. Kept so the Phase B
  # migration to FastAPI + SQLAlchemy has a database waiting for it.
  db-xrays:
    image: postgres:16
    container_name: db-xrays
    ports:
      - 5444:5432
    environment:
      # No fallback values: a credential written here is a credential in the
      # repository. Compose refuses to start the service until .env supplies one.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate one, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend-xrays:
    build:
      context: .
      dockerfile: ./compose/Dockerfile.backend
    container_name: backend-xrays
    image: backend-xrays
    depends_on:
      - db-xrays
    env_file:
      - path: .env
        required: false
    environment:
      MEDIA_ROOT: ${MEDIA_ROOT:-/var/www/static}
      MEDIA_URL: ${MEDIA_URL:-/media/}
      # Exports written by `cxr export`. Mounted read-only below; without
      # them the service still starts and /predict answers 503.
      MODEL_DIR: ${MODEL_DIR:-/var/www/models}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - 3080:3080
    volumes:
      - ./app/backend:/var/www/app/backend
      - media_volume:/var/www/static
      - ./ml/models/serving:/var/www/models:ro
    command: uvicorn api.main:app --host 0.0.0.0 --port 3080 --reload
    tty: true
    networks:
      - app-network

  frontend-xrays:
    build:
      context: .
      dockerfile: ./compose/Dockerfile.frontend
    container_name: frontend-xrays
    image: frontend-xrays
    depends_on:
      - backend-xrays
    env_file:
      - path: .env
        required: false
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend-xrays:3080}
    ports:
      - 3000:3000
    volumes:
      - ./app/frontend/:/var/www/app/frontend
    command: npm run dev
    tty: true
    networks:
      - app-network

volumes:
  media_volume:
  db_data:

networks:
  app-network:
