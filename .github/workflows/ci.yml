name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: setup/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r setup/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system checks
        working-directory: app/backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-key-not-used-to-protect-anything
        run: python manage.py check --deploy --fail-level ERROR

      - name: No missing migrations
        working-directory: app/backend
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: app/backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Type-check and build
        working-directory: app/frontend
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No database or environment files committed
        run: |
          if git ls-files | grep -E '(\.sqlite3$|^\.env$|\.env\.[^e])'; then
            echo "::error::Database or environment files are tracked by git"
            exit 1
          fi
          echo "OK"
