[project]
name = "cxr"
version = "0.1.0"
description = "Chest radiograph dataset assembly, leakage gates, and modelling"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pillow>=10.3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Kept out of the base install so CI and the gates stay fast. Needed only once
# real DICOM sources are being ingested or a model is being trained.
imaging = ["pydicom>=2.4", "monai>=1.3", "torch>=2.2"]

[project.scripts]
cxr = "cxr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cxr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
