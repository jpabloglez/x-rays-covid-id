[pytest]
# `.` on the path so a bare `pytest` can import `api`, which is what CI runs.
# Without this the suite only passes when invoked as `python -m pytest` or with
# PYTHONPATH set -- and a suite that passes only under the developer's habit is
# a suite that is not being run.
pythonpath = .
python_files = test_*.py
testpaths = tests
addopts = -q
