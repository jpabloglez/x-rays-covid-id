[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django's conventional `from .settings import *` re-export.
"app/backend/backend/test_settings.py" = ["F403", "F405", "E402"]
