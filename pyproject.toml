[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults; that is the framework's
# documented interface, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# The API tests skip when fastapi or torch is missing, so the imports they
# guard have to come after the importorskip calls.
"app/backend/tests/test_api.py" = ["E402"]
